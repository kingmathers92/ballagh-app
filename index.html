<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ballagh — Quran, Prayer Times & Hadith Companion</title>
    <meta
      name="description"
      content="Ballagh is a bilingual Islamic companion app: read the Quran, track prayer times, find the Qibla, discover hadith, and reflect in your journal."
    />
    <meta property="og:title" content="Ballagh — بلَّغ" />
    <meta
      property="og:description"
      content="A daily Islamic companion: Quran, prayer times, Qibla, hadith, and reflection - all in one place."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#2A4B8D" />
    <script>

      (function () {
        var saved = localStorage.getItem("theme");
        var theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
